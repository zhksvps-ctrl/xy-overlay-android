name: Build Android APK Final Debug

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Find and Build Android Project
        run: |
          echo "=== [디버그] 현재 저장소 전체 파일 구조 ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          echo "=== settings.gradle 파일 찾는 중 ==="
          SETTING_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit)
          
          if [ -z "$SETTING_FILE" ]; then
            echo "::warning::settings.gradle을 찾지 못했습니다. 최상위 폴더에서 빌드를 시도합니다."
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(dirname "$SETTING_FILE")
            echo "프로젝트 폴더 위치: $PROJECT_DIR"
          fi
          
          cd "$PROJECT_DIR"
          
          if [ ! -f "./gradlew" ]; then
            echo "=== gradlew가 없어 Gradle Wrapper를 자동 생성합니다 ==="
            gradle wrapper
          fi
          
          chmod +x gradlew
          echo "=== Gradle 빌드 시작 (assembleDebug) ==="
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
