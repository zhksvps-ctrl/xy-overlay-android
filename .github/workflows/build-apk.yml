name: Build APK with Auto-Wrapper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Wrapper and Build APK
        run: |
          echo "=== Checking current files ==="
          find . -maxdepth 2 -not -path '*/.*'
          
          # gradlew 파일이 없다면 시스템의 gradle을 이용해 wrapper 자동 생성
          if [ ! -f "./gradlew" ]; then
            echo "=== gradlew not found. Generating gradle wrapper automatically ==="
            gradle wrapper
          fi
          
          # 실행 권한 부여 및 빌드 실행
          chmod +x gradlew
          echo "=== Starting Gradle Build ==="
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
