name: Build Android APK Final

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Project and Build APK
        run: |
          echo "=== 안드로이드 프로젝트 폴더 자동 탐색 ==="
          SETTING_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit)
          
          if [ -z "$SETTING_FILE" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(dirname "$SETTING_FILE")
            echo "프로젝트 폴더 위치: $PROJECT_DIR"
          fi
          
          cd "$PROJECT_DIR"
          
          if [ ! -f "./gradlew" ]; then
            echo "=== gradlew 생성 중 ==="
            gradle wrapper
          fi
          
          chmod +x gradlew
          echo "=== 안드로이드 APK 빌드 시작 ==="
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
