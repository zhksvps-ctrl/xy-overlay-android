name: Build Android APK Auto-Find

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Find Project and Build
        run: |
          echo "=== 안드로이드 프로젝트 폴더 자동 탐색 ==="
          SETTING_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit)
          
          if [ -z "$SETTING_FILE" ]; then
            echo "::error::settings.gradle을 찾을 수 없습니다."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTING_FILE")
          echo "찾은 프로젝트 폴더: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          if [ ! -f "./gradlew" ]; then
            echo "=== gradlew 생성 중 ==="
            gradle wrapper
          fi
          
          chmod +x gradlew
          echo "=== 빌드 실행 ==="
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
